<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<script>
  // Renamed projects: an old address goes on to the same page under the new name, with its query and fragment.
  const moved = { 'onsoku-advance': 'sonic-advance-dreamport' };
  const [, first, ...rest] = location.pathname.split('/');
  if (moved[first]) location.replace('/' + [moved[first], ...rest].join('/') + location.search + location.hash);
</script>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --ink: #0b1240; --muted: #4a5577; --link: #1f5fe0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #060a26; --ink: #f2f7ff; --muted: #a9b6d8; --link: #8fc0ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { padding: 24px 16px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0; color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>Looking for <a href="/sonic-advance-dreamport/">Sonic Advance Dreamport</a>?</p>
</main>
</body>
</html>
